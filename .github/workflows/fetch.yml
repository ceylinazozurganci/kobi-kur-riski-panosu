name: Otomatik Kur Verisi Cekme

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Kutupahaneleri Yukle
        run: pip install requests pandas

      - name: Veriyi Cek
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python fetch_data.py

      - name: Entegrasyon Testleri
        run: |
          python -c "import pandas as pd; print('OK')"
          if [ -f index.html ]; then echo "Test OK"; else exit 1; fi
