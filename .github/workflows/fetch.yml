name: Otomatik Kur Verisi Çekme

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Kütüphaneleri Yükle
        run: pip install requests pandas

      - name: Veriyi Çek
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python fetch_data.py

      - name: Entegrasyon Testlerini Çalıştır
        run: |
          python -c "import pandas as pd; print('Pandas kütüphanesi hazır.')"
          if [ -f data.json ] || [ -f index.html ]; then echo "Test Başarılı: Proje dosyaları tam."; else exit 1; fi
